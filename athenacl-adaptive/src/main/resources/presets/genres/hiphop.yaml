  mode: {choose: [aeolian, dorian, phrygian], weights: [3, 3, 1], fallback: aeolian}
  leadingTone: false
harmony:
  style: loop
  progression:
    generate: grammar
    templates: "i bVI bIII bVII|i v bVI bVII|i bIII bVI bVII"
    fallback: [i, bVI, bIII, bVII]
    constraints: {startOn: i, endOn: [bVII]}
  harmonicRhythm: {choose: [2, 1], weights: [3, 1], fallback: 2}
  sevenths: none
  cadences: {8: bVII}
cadence: {strength: weak, every: 8}
drone: {enabled: false}
voicing: {style: {choose: [close, open], weights: [2, 1], fallback: close}, voiceLead: true, maxLeap: 4}
lead: {enabled: true, phrase: period, rhythmCells: {generate: po, po: basketGen, symbols: [lsS, sslL], count: 2, fallback: [lsS, sslL]}, register: [A4, E6]}
hooks: {enabled: true, candidates: 64}
tempo: {bpm: {range: [72, 96], step: 2, fallback: 84}}
layers: [bass, pad, drums, lead, chords, arp]
programs: {bass: 38, pad: 88, drums: 25, lead: 81, chords: 4, arp: 80}
instruments: {bass: bass.synth, pad: pad.newage, drums: drums.808, lead: lead.saw, chords: rhodes, arp: lead.square}
ensemble:
  select: auto
  kits: [gm-full]
  topK: 3
  roles:
    lead: {fit: ">=0.5", tags: {none: [noisy]}}
    pad: {tags: {any: [pad]}, fit: ">=0.5"}
    bass: {fit: ">=0.5", tags: {none: [noisy]}}
    arp: {tags: {any: [plucky]}, fit: ">=0.5"}
    chords: {fit: ">=0.5", tags: {none: [noisy]}}
    drums: {fit: ">=0.5"}
  constraints: {maxPairRoughness: 2000, maxMask: {lead: 0.95}, verdict: [ok, caution]}
density:
  pad: {degrees: [0, 2, 4]}
  arp: {degrees: [0, 2, 4, 2], steps: 8}
  bass: {step: 2}
  taiko: {step: 2, minVelocity: 0}
  brass: {stab: false}
  drums: {fill: false}
