genre: chiptune
character: "square"
meter: "4/4"
palette: "square,saw,bass,808,pad,celesta"
limits: "Square and saw leads. No bitcrush until the effects stage."
loudness:
  reference: -23
  maxSpread: 6
  offsets: {sneaking: -1.5, peaceful: -1.0, trading: -1.0, partying: 1.5, danger: 2.0, combat: 4.0}
scale:
  tonic: {choose: [C, D, E], weights: [4, 1, 1], fallback: C}
  mode: {choose: [ionian, mixolydian, lydian], weights: [4, 1, 1], fallback: ionian}
  leadingTone: {p: 0.2, fallback: false}
harmony:
  style: functional
  progression:
    generate: markov
    model: major-functional
    length: 4
    fallback: [I, vi, IV, V]
    constraints: {startOn: I, endOn: [V]}
  harmonicRhythm: {choose: [1, 2], weights: [3, 1], fallback: 1}
  sevenths: none
cadence: {strength: weak, every: 8}
drone: {enabled: false}
voicing: {style: {choose: [close, open], weights: [2, 1], fallback: close}, voiceLead: true, maxLeap: 4}
lead: {enabled: true, phrase: period, rhythmCells: {generate: po, po: basketGen, symbols: [lsS, sslL], count: 2, fallback: [lsS, sslL]}, register: [A4, E6]}
hooks: {enabled: true, candidates: 64}
tempo: {bpm: {range: [128, 152], step: 2, fallback: 140}}
layers: [arp, bass, lead, drums, pad, bell]
programs: {arp: 80, bass: 38, lead: 81, drums: 25, pad: 88, bell: 8}
instruments: {arp: lead.square, bass: bass.synth, lead: lead.saw, drums: drums.808, pad: pad.newage, bell: celesta}
ensemble:
  select: auto
  kits: [gm-lite]
  topK: 3
  roles:
    lead: {fit: ">=0.5", tags: {none: [noisy]}}
    pad: {tags: {any: [pad]}, fit: ">=0.5"}
    bass: {fit: ">=0.5", tags: {none: [noisy]}}
    arp: {tags: {any: [plucky]}, fit: ">=0.5"}
    drums: {fit: ">=0.5"}
    bell: {fit: ">=0.5", tags: {none: [noisy]}}
  constraints: {maxPairRoughness: 2000, maxMask: {lead: 0.95}, verdict: [ok, caution]}
density:
  pad: {degrees: [0, 2, 4]}
  arp: {degrees: [0, 2, 4, 2], steps: 8}
  bass: {step: 2}
  taiko: {step: 2, minVelocity: 0}
  brass: {stab: false}
  drums: {fill: false}
