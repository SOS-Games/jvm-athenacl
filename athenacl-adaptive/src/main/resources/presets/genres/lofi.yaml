genre: lofi
character: "rhodes"
meter: "4/4"
palette: "rhodes,bass,drums,piano,guitar,vibes"
limits: "Slow Rhodes, piano, guitar, and soft drums. No vinyl crackle until sampled layers."
loudness:
  reference: -23
  maxSpread: 6
  offsets: {sneaking: -1.5, peaceful: -1.0, trading: -1.0, partying: 1.5, danger: 2.0, combat: 4.0}
scale:
  tonic: {choose: [F, G, A], weights: [4, 1, 1], fallback: F}
  mode: {choose: [dorian, aeolian, mixolydian], weights: [4, 1, 1], fallback: dorian}
  leadingTone: false
harmony:
  style: modal
  progression:
    generate: grammar
    templates: "i7 bIII7 IV7 i7|i7 IV7 v7 i7|i7 bVII7 v7 i7"
    fallback: [i7, bIII7, IV7, i7]
    constraints: {startOn: i7, endOn: [i7]}
  harmonicRhythm: {choose: [2, 1], weights: [3, 1], fallback: 2}
  sevenths: dominant
  cadences: {8: i7}
cadence: {strength: weak, every: 8}
drone: {enabled: false}
voicing: {style: {choose: [close, open], weights: [2, 1], fallback: close}, voiceLead: true, maxLeap: 4}
lead: {enabled: true, phrase: period, rhythmCells: {generate: po, po: basketGen, symbols: [lsS, sslL], count: 2, fallback: [lsS, sslL]}, register: [A4, E6]}
hooks: {enabled: true, candidates: 64}
tempo: {bpm: {range: [60, 84], step: 2, fallback: 72}}
layers: [pad, bass, drums, chords, lead, harp]
programs: {pad: 4, bass: 33, drums: 0, chords: 0, lead: 11, harp: 27}
instruments: {pad: rhodes, bass: bass.finger, drums: drums.standard, chords: piano, lead: vibes, harp: guitar.clean}
ensemble:
  select: auto
  kits: [gm-full]
  topK: 3
  roles:
    lead: {fit: ">=0.5", tags: {none: [noisy]}}
    pad: {tags: {any: [pad]}, fit: ">=0.5"}
    bass: {fit: ">=0.5", tags: {none: [noisy]}}
    chords: {fit: ">=0.5", tags: {none: [noisy]}}
    drums: {fit: ">=0.5"}
    harp: {tags: {any: [plucky]}, fit: ">=0.5"}
  constraints: {maxPairRoughness: 2000, maxMask: {lead: 0.95}, verdict: [ok, caution]}
density:
  pad: {degrees: [0, 2, 4, 5]}
  arp: {degrees: [0, 2, 4, 2], steps: 8}
  bass: {step: 2}
  taiko: {step: 2, minVelocity: 0}
  brass: {stab: false}
  drums: {fill: false}
# Genre-base arrangement. A library state ignores this.
groove:
  pad: "off"
  harp: "off"
  chords: "x..............."
  chordsDur: "1/2"
  bass: "x.......x......."
  bassDur: "1/4"
  drums: "on"
  kick: "x.......x......."
  snare: "....x..........."
  hat: "x...x...x...x..."
  lead: [long-rest, dotted]
