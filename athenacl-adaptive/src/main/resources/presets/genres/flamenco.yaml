genre: flamenco
character: "palmas"
meter: "4/4"
palette: "guitar,bass,strings,drums"
limits: "Phrygian dominant, nylon and steel guitar. Not a copied palo."
loudness:
  reference: -23
  maxSpread: 6
  offsets: {sneaking: -1.5, peaceful: -1.0, trading: -1.0, partying: 1.5, danger: 2.0, combat: 4.0}
scale:
  tonic: {choose: [E, F, G], weights: [4, 1, 1], fallback: E}
  mode: {choose: [phrygian-dominant, phrygian, aeolian], weights: [4, 1, 1], fallback: phrygian-dominant}
  leadingTone: {p: 0.2, fallback: false}
harmony:
  style: modal
  progression:
    generate: markov
    model: modal-phrygian
    length: 4
    fallback: [i, bII, V, i]
    constraints: {startOn: i, endOn: [i]}
  harmonicRhythm: {choose: [1, 2], weights: [3, 1], fallback: 1}
  sevenths: none
cadence: {strength: weak, every: 8}
drone: {enabled: false}
voicing: {style: {choose: [close, open], weights: [2, 1], fallback: close}, voiceLead: true, maxLeap: 4}
lead: {enabled: true, phrase: period, rhythmCells: {generate: po, po: basketGen, symbols: [lsS, sslL], count: 2, fallback: [lsS, sslL]}, register: [A4, E6]}
hooks: {enabled: true, candidates: 64}
tempo: {bpm: {range: [88, 112], step: 2, fallback: 100}}
layers: [harp, lead, chords, bass, pad, drums]
programs: {harp: 24, lead: 27, chords: 29, bass: 32, pad: 48, drums: 0}
instruments: {harp: nylon, lead: guitar.clean, chords: guitar.overdrive, bass: bass.acoustic, pad: strings, drums: drums.standard}
ensemble:
  select: auto
  kits: [gm-lite]
  topK: 3
  roles:
    lead: {fit: ">=0.5", tags: {none: [noisy]}}
    pad: {tags: {any: [pad]}, fit: ">=0.5"}
    bass: {fit: ">=0.5", tags: {none: [noisy]}}
    chords: {fit: ">=0.5", tags: {none: [noisy]}}
    drums: {fit: ">=0.5"}
    harp: {tags: {any: [plucky]}, fit: ">=0.5"}
  constraints: {maxPairRoughness: 2000, maxMask: {lead: 0.95}, verdict: [ok, caution]}
density:
  pad: {degrees: [0, 2, 4]}
  arp: {degrees: [0, 2, 4, 2], steps: 8}
  bass: {step: 2}
  taiko: {step: 2, minVelocity: 0}
  brass: {stab: false}
  drums: {fill: false}
