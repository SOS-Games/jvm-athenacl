# Probe thresholds. These are starting values, calibrated on the CC0 fixture bank.
# A real kit's profile is produced by `kit analyze`, not by editing a verdict here.
# 4 stores the pitch-class grid and the per-class inharmonic limits.
probeVersion: 4
pitchSoftCents: 15
pitchHardCents: 30
inharmonicCents: 50
inharmonicEnergy: 0.25
flatness: 0.35
# Hotter than this is a loud note with a trim. A failure is a true peak past -0.3 dBTP.
clipDbfs: -6.0
loopClickSigma: 8
loopClickCount: 8
brightRatio: 2.0
warmRatio: 1.4
padAttackMs: 80
pluckAttackMs: 40
pluckDecayMs: 400
velocityMinLu: 3
