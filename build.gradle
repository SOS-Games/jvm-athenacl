buildscript {
  repositories {
    mavenCentral()
    gradlePluginPortal()
  }
}

allprojects {
  apply plugin: 'eclipse'
  apply plugin: 'idea'
}

configure(subprojects) {
  apply plugin: 'java-library'
  java.sourceCompatibility = 21
  java.targetCompatibility = 21
  tasks.withType(JavaCompile).configureEach {
    options.incremental = true
    options.encoding = 'UTF-8'
    options.release = 21
  }
}

subprojects {
  version = "$projectVersion"
  ext.appName = 'athenacl'
  repositories {
    mavenCentral()
  }
}

tasks.register('layerCheck') {
  group = 'athenacl'
  description = 'Run checks/L*.check. Optional -Player=L0a.'
  dependsOn ':athenacl-cli:layerCheck'
}

tasks.register('analysisCheck') {
  group = 'athenacl'
  description = 'Run the experimental analyzer checks and unit tests.'
  dependsOn ':athenacl-instruments:analysisTest', ':athenacl-cli:analysisCheck'
}

tasks.register('fetchSoundbanks') {
  group = 'athenacl'
  description = 'Download catalog soundbanks into the cache. Not part of layerCheck.'
  dependsOn ':athenacl-cli:fetchSoundbanks'
}

tasks.register('soundbankSmoke') {
  group = 'athenacl'
  description = 'Install catalog soundbanks, scan the FreePats banks, and render a scale through each. Not part of layerCheck.'
  dependsOn ':athenacl-cli:soundbankSmoke'
}

eclipse.project.name = 'jvm-athenacl-parent'
