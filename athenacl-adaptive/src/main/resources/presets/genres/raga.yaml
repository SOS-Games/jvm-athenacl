genre: raga
character: "sitar"
meter: "4/4"
palette: "sitar,strings,tambura,bansuri,bass"
limits: "A scale only. This is not raga grammar, and the sitar is the GM program."
loudness:
  reference: -23
  maxSpread: 6
  offsets: {sneaking: -1.5, peaceful: -1.0, trading: -1.0, partying: 1.5, danger: 2.0, combat: 4.0}
scale:
  tonic: {choose: [C, D, E], weights: [4, 1, 1], fallback: C}
  mode: {choose: [phrygian-dominant, phrygian, aeolian], weights: [4, 1, 1], fallback: phrygian-dominant}
  leadingTone: false
harmony:
  style: modal
  progression:
    generate: grammar
    templates: "I bII V I|I V iv I|I iv V I"
    fallback: [I, bII, V, I]
    constraints: {startOn: I, endOn: [I]}
  harmonicRhythm: 2
  sevenths: none
  cadences: {8: I}
cadence: {strength: weak, every: 8}
drone: {enabled: false}
voicing: {style: {choose: [close, open], weights: [2, 1], fallback: close}, voiceLead: true, maxLeap: 4}
lead: {enabled: true, phrase: period, rhythmCells: {generate: po, po: basketGen, symbols: [lsS, sslL], count: 2, fallback: [lsS, sslL]}, register: [A4, E6]}
hooks: {enabled: true, candidates: 64}
tempo: {bpm: {range: [56, 80], step: 2, fallback: 68}}
layers: [lead, drone, pad, harp, bass]
programs: {lead: 104, drone: 49, pad: 48, harp: 75, bass: 43}
instruments: {lead: sitar, drone: strings.slow, pad: strings, harp: panflute, bass: cello}
ensemble:
  select: auto
  kits: [gm-full]
  topK: 3
  roles:
    lead: {fit: ">=0.5", tags: {none: [noisy]}}
    pad: {tags: {any: [pad]}, fit: ">=0.5"}
    bass: {fit: ">=0.5", tags: {none: [noisy]}}
    harp: {tags: {any: [plucky]}, fit: ">=0.5"}
    drone: {fit: ">=0.5", tags: {none: [noisy]}}
  constraints: {maxPairRoughness: 2000, maxMask: {lead: 0.95}, verdict: [ok, caution]}
density:
  pad: {degrees: [0, 2, 4]}
  arp: {degrees: [0, 2, 4, 2], steps: 8}
  bass: {step: 2}
  taiko: {step: 2, minVelocity: 0}
  brass: {stab: false}
  drums: {fill: false}
# Genre-base arrangement. A library state ignores this.
groove:
  pad: "off"
  harp: "x.......x......."
  harpDur: "1/4"
  harpDegrees: [0, 1, 4, 5]
  bass: "x..............."
  bassDur: "1/1"
  lead: [long-rest, pizz-pair]
