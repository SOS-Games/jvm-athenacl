genre: scifi-space
character: "lydian,arp"
meter: "4/4"
palette: "pad,square,saw,bass,celesta,808"
limits: "GM synth pads, square and saw leads, synth bass, celesta, and an 808 kit. No filter sweeps until the effects stage. No sung lyrics."
loudness:
  reference: -23
  maxSpread: 6
  offsets: {sneaking: -1.5, peaceful: -1.0, trading: -1.0, partying: 1.5, danger: 2.0, combat: 4.0}
scale:
  tonic: {choose: [C, D, E], weights: [4, 1, 1], fallback: C}
  mode: {choose: [lydian, ionian, mixolydian], weights: [4, 1, 1], fallback: lydian}
  leadingTone: {p: 0.2, fallback: false}
harmony:
  style: modal
  progression:
    generate: markov
    model: major-functional
    length: 4
    fallback: [I, II, vi, V]
    constraints: {startOn: I, endOn: [V]}
  harmonicRhythm: {choose: [1, 2], weights: [3, 1], fallback: 1}
  sevenths: none
cadence: {strength: weak, every: 8}
drone: {enabled: false}
voicing: {style: {choose: [close, open], weights: [2, 1], fallback: close}, voiceLead: true, maxLeap: 4}
lead: {enabled: true, phrase: period, rhythmCells: {generate: po, po: basketGen, symbols: [lsS, sslL], count: 2, fallback: [lsS, sslL]}, register: [A4, E6], density: 0.35}
source:
  lead: {po: "markovPulse,(2,1,0.5),(3,4,2)", texture: LineGroove}
  arp: {po: "sieve,5@0|5@1|5@3", texture: LineGroove}
hooks: {enabled: true, candidates: 64}
tempo: {bpm: {range: [88, 112], step: 2, fallback: 100}}
layers: [pad, arp, bass, lead]
programs: {pad: 89, arp: 80, bass: 38, lead: 80}
instruments: {pad: pad.warm, arp: lead.square, bass: bass.synth, lead: lead.square}
ensemble:
  select: auto
  kits: [gm-lite]
  topK: 3
  roles:
    lead: {fit: ">=0.5", tags: {none: [noisy]}}
    pad: {tags: {any: [pad]}, fit: ">=0.5"}
    bass: {fit: ">=0.5", tags: {none: [noisy]}}
    arp: {tags: {any: [plucky]}, fit: ">=0.5"}
  constraints: {maxPairRoughness: 2000, maxMask: {lead: 0.95}, verdict: [ok, caution]}
density:
  pad: {degrees: [0, 2, 4]}
  arp: {degrees: [0, 2, 4, 3], steps: 8}
  bass: {step: 2}
  taiko: {step: 2, minVelocity: 0}
  brass: {stab: false}
  drums: {fill: false}
