genre: ambient
character: "sparse,pad"
meter: "4/4"
palette: "pad,celesta,choir,harp,flute,cello"
limits: "Slow pads, choir, harp, and flute. No filter sweeps until the effects stage."
loudness:
  reference: -23
  maxSpread: 6
  offsets: {sneaking: -1.5, peaceful: -1.0, trading: -1.0, partying: 1.5, danger: 2.0, combat: 4.0}
scale:
  tonic: {choose: [C, D, E], weights: [4, 1, 1], fallback: C}
  mode: {choose: [lydian, ionian, mixolydian], weights: [4, 1, 1], fallback: lydian}
  leadingTone: {p: 0.2, fallback: false}
harmony:
  style: modal
  progression:
    generate: grammar
    templates: "I II vi V|I vi IV V|I IV V I"
    fallback: [I, II, vi, V]
    constraints: {startOn: I, endOn: [V, I, V]}
  harmonicRhythm: {choose: [1, 2], weights: [3, 1], fallback: 1}
  sevenths: none
cadence: {strength: weak, every: 8}
drone: {enabled: false}
voicing: {style: {choose: [close, open], weights: [2, 1], fallback: close}, voiceLead: true, maxLeap: 4}
lead: {enabled: true, phrase: period, rhythmCells: {generate: po, po: basketGen, symbols: [lsS, sslL], count: 2, fallback: [lsS, sslL]}, register: [A4, E6]}
hooks: {enabled: true, candidates: 64}
tempo: {bpm: {range: [48, 72], step: 2, fallback: 60}}
layers: [pad, bell, drone, chords, lead, bass]
programs: {pad: 89, bell: 8, drone: 52, chords: 46, lead: 73, bass: 43}
instruments: {pad: pad.warm, bell: celesta, drone: choir, chords: harp, lead: flute, bass: cello}
ensemble:
  select: auto
  kits: [gm-lite]
  topK: 3
  roles:
    lead: {fit: ">=0.5", tags: {none: [noisy]}}
    pad: {tags: {any: [pad]}, fit: ">=0.5"}
    bass: {fit: ">=0.5", tags: {none: [noisy]}}
    chords: {fit: ">=0.5", tags: {none: [noisy]}}
    bell: {fit: ">=0.5", tags: {none: [noisy]}}
    drone: {fit: ">=0.5", tags: {none: [noisy]}}
  constraints: {maxPairRoughness: 2000, maxMask: {lead: 0.95}, verdict: [ok, caution]}
density:
  pad: {degrees: [0, 2, 4]}
  arp: {degrees: [0, 2, 4, 3], steps: 8}
  bass: {step: 2}
  taiko: {step: 2, minVelocity: 0}
  brass: {stab: false}
  drums: {fill: false}
