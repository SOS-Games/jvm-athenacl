genre: hiphop
character: "trap"
meter: "4/4"
palette: "808,pad,drums,saw,rhodes"
limits: "Instrumental only. GM has no rap vocals."
loudness:
  reference: -23
  maxSpread: 6
  offsets: {sneaking: -1.5, peaceful: -1.0, trading: -1.0, partying: 1.5, danger: 2.0, combat: 4.0}
scale:
